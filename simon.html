<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>simon Game</title>
    <link rel="stylesheet" href="simon.css">
</head>
<body>
    <h1>Simon Says Game</h1>
    <h2>Press any key to start Game</h2>
    <div class="div-container">
        <div class="line-one">
            <div class="but red" type="button" id="red">1</div>
            <div class="but green" type="button" id="green">2</div>
        </div>
        <div class="line-one">
            <div class="but blue" type="button" id="blue">3</div>
            <div class="but yellow" type="button" id="yellow">4</div>
        </div>
    </div>
    <script src="simon.js"></script>
</body>
</html>
